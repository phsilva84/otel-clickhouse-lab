# Lab OTel -> ClickHouse -> Grafana (alvo: e2-micro, 1 GB RAM + 2 GB swap)
# Sobe com:  docker compose up -d                 (stack base)
#            docker compose --profile load up -d  (+ carga sintética)
# Na VM o cloud-init usa: docker compose --env-file /etc/otel-lab.env up -d
# Tags: 'latest' é placeholder; fixe as versões que você validar (variáveis abaixo).

services:
  clickhouse:
    image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:latest}
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: otel
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      - ./clickhouse/users.d:/etc/clickhouse-server/users.d
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    # Sem 'ports': 9000/8123 ficam só na rede interna do compose
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  otel-collector:
    image: ${OTELCOL_IMAGE:-otel/opentelemetry-collector-contrib:latest}
    restart: unless-stopped
    user: "0:0" # lab: evita problema de permissão no volume da fila persistente
    command: ["--config=/etc/otelcol/gateway.yaml"]
    environment:
      GOMEMLIMIT: 350MiB # abaixo do memory_limiter (409 MiB)
      CLICKHOUSE_ENDPOINT: tcp://clickhouse:9000
      CLICKHOUSE_DATABASE: otel
      CLICKHOUSE_USERNAME: default
      CLICKHOUSE_PASSWORD: ""
    volumes:
      - ./collector/gateway.yaml:/etc/otelcol/gateway.yaml:ro
      - collector-queue:/var/lib/otelcol/file_storage
    ports:
      - "4317:4317" # OTLP gRPC (firewall GCP restringe ao seu IP)
      - "4318:4318" # OTLP HTTP
      - "127.0.0.1:13133:13133" # health_check
      - "127.0.0.1:8888:8888"   # métricas internas
    depends_on:
      clickhouse:
        condition: service_healthy

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana-oss:latest}
    restart: unless-stopped
    environment:
      GF_PLUGINS_PREINSTALL: grafana-clickhouse-datasource
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin} # TROQUE no primeiro login
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      clickhouse:
        condition: service_healthy

  # ---- carga sintética (profile 'load') ----
  loadgen-traces:
    profiles: ["load"]
    image: ${TELEMETRYGEN_IMAGE:-ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:latest}
    restart: unless-stopped
    command: ["traces", "--otlp-insecure", "--otlp-endpoint=otel-collector:4317", "--rate=5", "--duration=1h", "--service=lab-ok"]
    depends_on: [otel-collector]

  loadgen-traces-error:
    profiles: ["load"]
    image: ${TELEMETRYGEN_IMAGE:-ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:latest}
    restart: unless-stopped
    command: ["traces", "--otlp-insecure", "--otlp-endpoint=otel-collector:4317", "--rate=1", "--duration=1h", "--service=lab-error", "--status-code=Error"]
    depends_on: [otel-collector]

  loadgen-logs:
    profiles: ["load"]
    image: ${TELEMETRYGEN_IMAGE:-ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:latest}
    restart: unless-stopped
    command: ["logs", "--otlp-insecure", "--otlp-endpoint=otel-collector:4317", "--rate=10", "--duration=1h"]
    depends_on: [otel-collector]

  loadgen-metrics:
    profiles: ["load"]
    image: ${TELEMETRYGEN_IMAGE:-ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:latest}
    restart: unless-stopped
    command: ["metrics", "--otlp-insecure", "--otlp-endpoint=otel-collector:4317", "--rate=5", "--duration=1h"]
    depends_on: [otel-collector]

volumes:
  clickhouse-data:
  collector-queue:
  grafana-data:
