name: terraform-plan
on:
  pull_request:
    paths: ["terraform/**"]

permissions:
  contents: read
  id-token: write # Workload Identity Federation (sem chave JSON)

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.TF_SA_EMAIL }}
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init
      - run: terraform validate
      - run: terraform plan -var-file=environments/lab/terraform.tfvars -no-color
