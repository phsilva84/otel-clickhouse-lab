# Gateway consolidado (C1+C2) do lab.
# Ordem dos processors (produção): memory_limiter -> resourcedetection -> tail_sampling (só traces) -> batch

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage:
    directory: /var/lib/otelcol/file_storage # fila persistente: sobrevive a restart/ClickHouse fora

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 409
    spike_limit_mib: 100
  resourcedetection:
    detectors: [env, system, gcp]
    timeout: 2s
    override: false
  tail_sampling:
    decision_wait: 10s
    num_traces: 5000 # reduzido p/ 1 GB de RAM
    policies:
      - name: keep-errors # 100% dos erros
        type: status_code
        status_code: { status_codes: [ERROR] }
      - name: sample-success # ~10% do resto
        type: probabilistic
        probabilistic: { sampling_percentage: 10 }
  batch:
    send_batch_size: 1024
    timeout: 5s

exporters:
  clickhouse:
    endpoint: ${env:CLICKHOUSE_ENDPOINT}
    database: ${env:CLICKHOUSE_DATABASE}
    username: ${env:CLICKHOUSE_USERNAME}
    password: ${env:CLICKHOUSE_PASSWORD}
    create_schema: true
    ttl: 720h # 30d
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 1000
      storage: file_storage
  debug:
    verbosity: basic
    sampling_initial: 5
    sampling_thereafter: 500

service:
  extensions: [health_check, file_storage]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, tail_sampling, batch]
      exporters: [clickhouse, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [clickhouse, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [clickhouse, debug]
